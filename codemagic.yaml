workflows:
  react-native:
    name: Build Android APK
    max_build_duration: 20
    environment:
      vars:
        PACKAGE_NAME: "com.legalassistapp"  # Customize as needed
      node: 18
      xcode: latest
      android: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - madsats0@gmail.com
