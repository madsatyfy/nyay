workflows:
  build-android:
    name: Build Android APK
    max_build_duration: 30
    environment:
      android: latest
      node: 18
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - madsats0@gmail.com
